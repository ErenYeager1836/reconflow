name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install flake8
          pip install .
      - name: Syntax check
        run: python -m py_compile reconflow/*.py
      - name: Lint
        run: flake8 reconflow tests --max-line-length=100 --ignore=E203,W503,W504
      - name: Run unit tests
        run: python -m unittest discover tests -v
