name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reconflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image runs as unprivileged reconuser
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker build -t reconflow-verify:test .
            TEST_IMAGE="reconflow-verify:test"
          else
            IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            TEST_IMAGE="ghcr.io/${IMAGE_OWNER}/reconflow:${{ steps.meta.outputs.version }}"
          fi
          docker run --rm --entrypoint id "$TEST_IMAGE" -u | tee /tmp/id-output
          grep -q '^10001$' /tmp/id-output
